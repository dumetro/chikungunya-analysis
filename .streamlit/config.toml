# Pin the dashboard to a light base theme so the WHO minimal styling renders
# consistently regardless of the viewer's OS dark-mode setting.
[theme]
base = "light"
primaryColor = "#0093D5"            # WHO blue
backgroundColor = "#F6F8FA"         # airy light canvas (cards sit on top in white)
secondaryBackgroundColor = "#FFFFFF" # sidebar / widgets
textColor = "#1F2937"               # dark slate — readable on light surfaces
font = "sans serif"
