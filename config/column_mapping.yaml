# Maps the source Excel layout to the chikungunya_analysis DB columns.
#
# Edit this file when the Excel headers change — no code change required.
# Header matching is case-insensitive and whitespace-insensitive.

# Which sheet to read (name or 0-based index) and which row holds the headers.
sheet: 0
header_row: 0

# Excel header  ->  DB column name.
# Left side: the header as it appears in the spreadsheet (any case / spacing).
# Right side: the target column in public.chikungunya_analysis.
columns:
  "DATE OF NOTIFICATION": date_of_notification
  "DATE OF SAMPLE TAKEN": date_of_sample_taken
  "EPI WEEK": epi_week
  "Active/Passive": active_passive
  "HEALTH REGION": health_region
  "HEALTH OFFICE": health_office
  "LOCALITY": locality
  "AGE": age
  "AGE GROUP": age_group
  "GENDER": gender
  "NATIONALITY": nationality
  "OCCUPATION": occupation
  "PAST HISTORY OF INFECTION OF CHIKUNGUNYA": past_history_of_chikungunya
  "PREGNANCY (YES OR NO) IF YES SPECIFY GESTATION WEEK": pregnancy
  "COMORBIDITIES/PMH": comorbidities_pmh
  "COMORBIDITIES": comorbidities_pmh
  "DATE OF ONSET OF SYMPTOMS": date_of_onset_symptoms
  "DATE OF ONSET SYMPTOMS": date_of_onset_symptoms
  "SYMPTOMS": symptoms
  "EPI LINKAGE": epi_linkage
  "LOCAL OR IMPORTED?": local_or_imported
  "HEALTH INSTITUTION ATTENDED": health_institution_attended
  "DATE ATTENDED": date_attended
  "HEALTH INSTITUTION, If Admitted": health_institution
  "DATE OF ADMISSION": date_of_admission
  "PCR": pcr_result
  "PCR RESULT": pcr_result
  "DATE OF NEGATIVE PCR": date_of_negative_pcr
  "OUTCOME": outcome
  "DMU/HOSPITALISED/TBA/MISSING": dmu_hospitalised_tba_missing
  "REMARKS": remarks

# Columns that must be routed through dates.to_iso8601().
date_columns:
  - date_of_notification
  - date_of_sample_taken
  - date_of_onset_symptoms
  - date_attended
  - date_of_admission
  - date_of_negative_pcr

# Integer columns.
integer_columns:
  - age
  - gestation_week

# Yes/No columns (canonicalised to Yes / No / Unknown).
yes_no_columns:
  - past_history_of_chikungunya
  - pregnancy
  - if_admitted

# Free-text multi-value columns normalised against *_raw_map tables.
multivalue_columns:
  symptoms: symptom
  comorbidities_pmh: comorbidity

# Single-value coded columns normalised against a raw_map / reference table.
coded_columns:
  occupation: occupation
  nationality: nationality

# Single-value columns normalised against analysis_lookups (lk_category).
# The canonical value list per category lives in analysis_lookups; raw values
# are matched case-insensitively, then via value_overrides, then value_patterns.
lookup_columns:
  gender: GENDER
  age_group: AGE_GROUP
  active_passive: ACTIVE_PASSIVE
  local_or_imported: LOCAL_IMPORTED
  pcr_result: PCR_RESULT
  outcome: OUTCOME

# Optional per-value overrides (exact, case-insensitive) applied during
# normalisation, by DB column. Extend these for one-off synonyms.
value_overrides:
  gender:
    "m": "Male"
    "f": "Female"
    "male": "Male"
    "female": "Female"
  age_group:
    "60 and above": "60-150"
    "60+": "60-150"

# Optional regex (case-insensitive) -> canonical rules applied during
# normalisation, by DB column. First match wins. Use for messy free-text
# variants. Add more as new patterns appear in the unmapped-values report.
value_patterns:
  pcr_result:
    "\\bpos": "Positive"        # POS, POSITVE, "POS ON 11.5.2026", "PCR POS ..."
    "\\bneg": "Negative"
    "^p$": "Positive"           # a lone "P" means Positive
    "^y(es)?$": "Positive"      # "Y" / "Yes" mean Positive
    "pend|await": "Pending"
  age_group:
    "60.*above|>=?\\s*60|60\\s*\\+": "60-150"
