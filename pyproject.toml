[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chikungunya-pipeline"
version = "0.1.0"
description = "Repeatable data-cleaning pipeline and WHO-styled dashboard for Chikungunya outbreak surveillance data"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
